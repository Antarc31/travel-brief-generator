<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso alla beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --paper:#FBF4E8;
    --paper-deep:#F1E6D2;
    --route:#1F9D8B;
    --gold:#F2A93B;
    --muted-paper:#7C6A52;
    --line:#DCCFB4;
    --radius:14px;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .card{max-width:520px;text-align:center;}
  .route-divider{display:flex;align-items:center;gap:10px;color:#8DA0C4;font-family:var(--mono);font-size:12px;margin:0 0 26px;justify-content:center;}
  .route-divider .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;}
  .route-divider .line{width:60px;height:1px;background-image:linear-gradient(to right, #8DA0C4 40%, transparent 0%);background-size:8px 1px;background-repeat:repeat-x;}
  .route-divider svg{flex:none;color:var(--gold);}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vw,30px);margin:0 0 16px;}
  p{font-size:16px;color:#C7D0E0;margin:0 0 32px;}
  .btn{font-family:var(--sans);font-weight:600;font-size:15.5px;padding:15px 30px;border-radius:999px;border:none;cursor:pointer;display:inline-block;text-decoration:none;background:var(--gold);color:var(--ink);}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--route);outline-offset:3px;}
</style>
</head>
<body>
  <div class="card">
    <div class="route-divider">
      <span class="dot"></span><span class="line"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1 .1-1.3.5l-.4.6c-.4.6-.2 1.4.4 1.7l5.8 3-2 2.5H4l-1.5 2.5L5 18l1.3 3 2.5-1.5v-3l2.5-2 3 5.8c.3.6 1.1.8 1.7.4l.6-.4c.4-.3.6-.8.5-1.3Z"/></svg>
      <span class="line"></span><span class="dot"></span>
    </div>
    <h1>Perfetto.</h1>
    <p>Ora puoi provare la dashboard. Ti chiediamo soltanto di utilizzare il prodotto per il tuo viaggio reale e di lasciarci un feedback sincero alla fine.</p>
    <a href="/app/" class="btn">Vai alla dashboard →</a>
  </div>
</body>
</html>
