<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grazie per il feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --paper:#FBF4E8;
    --route:#1F9D8B;
    --gold:#F2A93B;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .card{max-width:520px;text-align:center;}
  .route-divider{display:flex;align-items:center;gap:10px;color:#8DA0C4;font-family:var(--mono);font-size:12px;margin:0 0 26px;justify-content:center;}
  .route-divider .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;}
  .route-divider .line{width:60px;height:1px;background-image:linear-gradient(to right, #8DA0C4 40%, transparent 0%);background-size:8px 1px;background-repeat:repeat-x;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vw,30px);margin:0 0 16px;}
  p{font-size:16px;color:#C7D0E0;margin:0;}
</style>
</head>
<body>
  <div class="card">
    <div class="route-divider">
      <span class="dot"></span><span class="line"></span><span class="line"></span><span class="dot"></span>
    </div>
    <h1>Grazie.</h1>
    <p>Il tuo feedback ci aiuta a capire cosa funziona davvero prima di aprire il prodotto ad altre persone.</p>
  </div>
</body>
</html>
